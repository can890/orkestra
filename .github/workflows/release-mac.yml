name: Release macOS

# Masaüstü sürüm numarası main'de değiştiğinde Apple Silicon paketini derler, kalıcı Orkestra
# imzasıyla imzalar ve GitHub Releases'e "latest" olarak yayımlar. Mac'teki uygulama içi
# güncelleyici (src/main/host/updates/) yeni sürümü buradan indirir. Adımlar
# agents/risky-areas/updater.md içindeki "Release-time requirements" kurallarını izler.

on:
  push:
    branches: [main]
    paths: [apps/orkestra-desktop/package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Derle, imzala ve doğrula; yayımlama
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Yüklü uygulamaların kabul ettiği imza sertifikasının SHA-1 başı (designated requirement).
      # Sertifika asla değiştirilmemeli; farklı sertifika her kurulu uygulamada güncellemeyi bozar.
      EXPECTED_SIGNING_LEAF: 119df61c
      # Kurulu uygulamaların designated requirement'ındaki paket kimliği; ürün adı değişse de
      # (36ee0935 ile Orkestra → Sovra) sabit kalmalı.
      EXPECTED_BUNDLE_ID: com.orkestra.stable
      # Uygulama içi güncelleyicinin aradığı ZIP adı (src/main/host/updates/mac-installer.ts,
      # zipAssetName). Kurulu sürümler bu adı arar; yapılandırma değişirse yayın durdurulur.
      UPDATER_ZIP_ASSET: orkestra-arm64.zip
      APP_DIR: apps/orkestra-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "SIGNING_DIR=$RUNNER_TEMP/orkestra-signing" >> "$GITHUB_ENV"
          version=$(jq -r .version "$APP_DIR/package.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Deneme modu: paket derlenip doğrulanacak, yayımlanmayacak."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version zaten yayımlanmış; atlanıyor."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.version.outputs.skip == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        if: steps.version.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Resolve bundle names
        if: steps.version.outputs.skip == 'false'
        # Paket ve varlık adlarının tek kaynağı electron-builder yapılandırmasıdır; .app adı
        # ürün adını izler. Yapılandırma yalnızca tür içe aktardığından bağımlılık gerektirmez.
        run: |
          cd "$APP_DIR"
          node --input-type=module -e '
            const { default: config } = await import("./electron-builder.config.ts");
            const artifact = (ext) =>
              config.artifactName.replace("${arch}", "arm64").replace("${ext}", ext);
            const values = {
              APP_NAME: config.productName,
              APP_BUNDLE_ID: config.appId,
              APP_BUNDLE: `${config.directories.output}/mac-arm64/${config.productName}.app`,
              ZIP_ASSET: artifact("zip"),
              DMG_ASSET: artifact("dmg"),
            };
            for (const [key, value] of Object.entries(values)) {
              if (typeof value !== "string" || !value || /[\n\r]/.test(value)) {
                console.error(`Invalid ${key}: ${value}`);
                process.exit(1);
              }
              console.log(`${key}=${value}`);
            }
          ' > "$RUNNER_TEMP/bundle-names.env"
          cat "$RUNNER_TEMP/bundle-names.env"
          cat "$RUNNER_TEMP/bundle-names.env" >> "$GITHUB_ENV"
          # Not sourced: the canary product name contains a space.
          APP_BUNDLE_ID=$(sed -n 's/^APP_BUNDLE_ID=//p' "$RUNNER_TEMP/bundle-names.env")
          ZIP_ASSET=$(sed -n 's/^ZIP_ASSET=//p' "$RUNNER_TEMP/bundle-names.env")
          if [ "$APP_BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::appId $APP_BUNDLE_ID; kurulu uygulamalar $EXPECTED_BUNDLE_ID bekliyor."
            exit 1
          fi
          if [ "$ZIP_ASSET" != "$UPDATER_ZIP_ASSET" ]; then
            echo "::error::ZIP adı $ZIP_ASSET; uygulama içi güncelleyici $UPDATER_ZIP_ASSET arıyor."
            exit 1
          fi

      - name: Install dependencies
        if: steps.version.outputs.skip == 'false'
        # Lifecycle scripts stay on: the desktop postinstall rebuilds native modules for Electron.
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && break
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Rebuild native modules for Electron
        if: steps.version.outputs.skip == 'false'
        # postinstall CI ortamında Electron yeniden derlemesini atlar; paketlenen better-sqlite3
        # Node ABI'siyle kalırsa uygulama açılışta "NODE_MODULE_VERSION" hatasıyla durur.
        run: pnpm --dir "$APP_DIR" run rebuild

      - name: Import signing identity
        if: steps.version.outputs.skip == 'false'
        env:
          P12_BASE64: ${{ secrets.ORKESTRA_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ORKESTRA_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::ORKESTRA_SIGNING_P12_BASE64 ve ORKESTRA_SIGNING_P12_PASSWORD gizli değerleri tanımlı değil."
            exit 1
          fi
          umask 077
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$P12_BASE64" | base64 --decode > "$SIGNING_DIR/identity.p12"
          /usr/bin/openssl pkcs12 -in "$SIGNING_DIR/identity.p12" -passin env:P12_PASSWORD \
            -nokeys -clcerts -out "$SIGNING_DIR/certificate.pem"
          leaf=$(/usr/bin/openssl x509 -in "$SIGNING_DIR/certificate.pem" -noout -fingerprint -sha1 \
            | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')
          case "$leaf" in
            "$EXPECTED_SIGNING_LEAF"*) echo "İmza sertifikası doğru: $leaf" ;;
            *) echo "::error::Beklenmeyen imza sertifikası ($leaf)."; exit 1 ;;
          esac

          keychain="$SIGNING_DIR/signing.keychain-db"
          keychain_password=$(/usr/bin/openssl rand -hex 24)
          printf '%s' "$keychain_password" > "$SIGNING_DIR/keychain-password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$SIGNING_DIR/identity.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          # macOS yalnızca kod imzalama için güvenilen sertifikayla imzalatır.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$SIGNING_DIR/certificate.pem"
          rm -f "$SIGNING_DIR/identity.p12"

      - name: Build app bundle
        if: steps.version.outputs.skip == 'false'
        env:
          # The renderer bundle exceeds Node's default ~2 GB heap on the 7 GB runner.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          # Nx builds the workspace packages first (^build); their production exports point at dist.
          pnpm exec nx run @orkestra/orkestra-desktop:build
          cd "$APP_DIR"
          pnpm exec electron-builder --mac dir --arm64 -c.mac.identity=null \
            --config electron-builder.config.ts

      - name: Sign app bundle
        if: steps.version.outputs.skip == 'false'
        run: |
          cd "$APP_DIR"
          test -d "$APP_BUNDLE"
          ORKESTRA_SIGNING_DIR="$SIGNING_DIR" sh scripts/release/sign-mac-local.sh "$APP_BUNDLE"
          # sign-mac-local.sh kimlik bulamazsa ad-hoc imzaya döner; ad-hoc paket yayımlanmamalı.
          requirement=$(codesign -d -r- "$APP_BUNDLE" 2>&1 | sed -n 's/^designated => //p')
          echo "Designated requirement: $requirement"
          case "$requirement" in
            "identifier \"$EXPECTED_BUNDLE_ID\" and certificate leaf = H\"$EXPECTED_SIGNING_LEAF"*) ;;
            *) echo "::error::Paket kalıcı Orkestra imzasıyla imzalanmadı."; exit 1 ;;
          esac
          echo "REQUIREMENT=$requirement" >> "$GITHUB_ENV"

      - name: Package dmg and zip
        if: steps.version.outputs.skip == 'false'
        run: |
          cd "$APP_DIR"
          pnpm exec electron-builder --mac dmg zip --arm64 -c.mac.identity=null \
            --prepackaged "$APP_BUNDLE" --config electron-builder.config.ts

      - name: Verify packages like the updater
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "$APP_DIR/release"
          check="$RUNNER_TEMP/zip-check"
          rm -rf "$check"
          ditto -x -k "$ZIP_ASSET" "$check"
          # Güncelleyici ZIP içinde tek bir .app bekler (mac-installer.ts, findSingleApp).
          test "$(ls "$check")" = "$APP_NAME.app"
          app="$check/$APP_NAME.app"
          codesign --verify --deep --strict -R "=$REQUIREMENT" "$app"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$EXPECTED_BUNDLE_ID"
          # Yerel modüller paketin kendi Electron'u ile yüklenebilmeli (ABI uyumu).
          # Electron -e içinde yakalanmayan hatada da 0 döndüğü için çıkış kodu açıkça verilir.
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/$executable" -e \
            "try { require(process.argv[1]); } catch (e) { console.error(e.message); process.exit(1); }" \
            "$app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          hdiutil verify "$DMG_ASSET"
          shasum -a 256 "$DMG_ASSET" "$ZIP_ASSET" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        if: steps.version.outputs.skip == 'false' && inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$GITHUB_WORKSPACE/docs/releases/v$VERSION.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          cd "$APP_DIR/release"
          gh release create "v$VERSION" "$DMG_ASSET" "$ZIP_ASSET" SHA256SUMS \
            --title "$APP_NAME v$VERSION" --target "$GITHUB_SHA" --latest \
            "$@"

      - name: Remove signing keychain
        if: always()
        run: |
          [ -n "${SIGNING_DIR:-}" ] || exit 0
          if [ -f "$SIGNING_DIR/signing.keychain-db" ]; then
            security delete-keychain "$SIGNING_DIR/signing.keychain-db" || true
          fi
          rm -rf "$SIGNING_DIR"
