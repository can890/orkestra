<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Orkestra Chrome Köprüsü</title>
    <style>
      body { font: 14px system-ui, sans-serif; width: 320px; margin: 0; padding: 14px 16px 16px; color: #1f2328; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      h2 { font-size: 13px; margin: 16px 0 6px; }
      button { font: inherit; padding: 6px 14px; cursor: pointer; }
      .muted { color: #6b7280; font-size: 12px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .row button { margin-left: auto; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; flex: none; }
      .dot.connected { background: #16a34a; }
      .dot.connecting { background: #d97706; }
      .dot.disconnected { background: #dc2626; }
      #error { color: #b91c1c; font-size: 12px; margin-top: 6px; min-height: 1.2em; }
      #current { margin: 4px 0; }
      #sites { list-style: none; margin: 0; padding: 0; font-size: 13px; }
      #sites li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
      #sites li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #sites li button { padding: 2px 8px; font-size: 12px; }
      .footer { margin-top: 14px; }
      .footer button { padding: 4px 10px; }
    </style>
  </head>
  <body>
    <h1>Orkestra Chrome Köprüsü</h1>
    <div class="row">
      <span id="dot" class="dot" aria-hidden="true"></span>
      <span id="status" role="status">…</span>
      <button id="toggle" type="button">Bağlan</button>
    </div>
    <div id="error" role="alert"></div>

    <h2>Bu site</h2>
    <div id="current" class="muted"></div>

    <h2>İzin verilen siteler</h2>
    <ul id="sites" class="muted"></ul>

    <div class="footer">
      <button id="options" type="button">Ayarlar (belirteç ve bağlantı noktası)</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
