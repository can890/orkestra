<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Orkestra Chrome Köprüsü</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="icons/icon-48.png" alt="Orkestra" width="24" height="24" />
          <div class="brand-text">
            <h1 class="brand-title">Orkestra</h1>
            <span class="brand-ver">Chrome</span>
          </div>
        </div>
        <button id="toggle" type="button" class="toggle-pill is-enabled" role="switch" aria-checked="true">
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span id="toggle-label">Açık</span>
        </button>
      </header>

      <section class="card" aria-label="Bağlantı durumu">
        <div class="status-row">
          <span id="dot" class="dot waiting" aria-hidden="true"></span>
          <span id="status" class="status-label" role="status">Bağlanıyor…</span>
          <span id="tab-count" class="tab-count">Hazır</span>
        </div>
        <p id="hint" class="hint">
          Orkestra masaüstündeki ajanlar Chrome sekmelerinizi doğrudan kullanır; site izni veya kod gerekmez.
        </p>
        <div class="active-context">
          <span class="active-context-dot" aria-hidden="true"></span>
          <span id="context" class="active-context-text">Chrome bağlantısı hazır</span>
        </div>
      </section>

      <section class="card" aria-label="Ajan etkinlikleri">
        <div class="section-head">
          <span class="section-title">Son işlemler</span>
          <button id="clear-activity" type="button" class="clear-btn" hidden>Temizle</button>
        </div>
        <ul id="activity" class="activity-list"></ul>
        <p id="activity-empty" class="activity-empty">
          Henüz işlem yok — Orkestra&apos;dan tarayıcı komutu verdiğinizde burada canlı görünür.
        </p>
      </section>

      <div id="port-drawer" class="port-drawer" hidden>
        <input id="port-input" class="port-input" type="number" min="1024" max="65535" aria-label="Bağlantı noktası" />
        <button id="port-save" type="button" class="save-btn">Kaydet</button>
      </div>

      <footer class="footer">
        <span id="endpoint" class="endpoint">127.0.0.1:47653</span>
        <div class="footer-actions">
          <button id="port-toggle" type="button" class="ghost-btn">Port</button>
          <button id="open-options" type="button" class="ghost-btn">Ayarlar</button>
        </div>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
