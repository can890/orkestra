<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Orkestra Chrome Köprüsü — Ayarlar</title>
    <style>
      :root {
        --bg: #111111;
        --surface: #181818;
        --surface-2: #222222;
        --border: #2b2b2b;
        --text: #ededed;
        --muted: #9a9a9a;
        --accent: #008f5a;
        --accent-bright: #18b87d;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fcfcfc;
          --surface: #ffffff;
          --surface-2: #f2f2f2;
          --border: #e1e1e1;
          --text: #171717;
          --muted: #616161;
          --accent: #008753;
          --accent-bright: #007d4d;
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 36px 20px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      }
      .wrap {
        max-width: 520px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .head img {
        border-radius: 9px;
      }
      h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      input {
        font: inherit;
        width: 100%;
        height: 38px;
        padding: 0 11px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        outline: none;
      }
      input:focus {
        border-color: var(--accent-bright);
      }
      button {
        font: inherit;
        font-weight: 600;
        height: 38px;
        padding: 0 16px;
        border-radius: 9px;
        border: 0;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        align-self: flex-start;
      }
      button:hover {
        filter: brightness(1.08);
      }
      .muted {
        margin: 0;
        color: var(--muted);
        font-size: 12.5px;
      }
      #message {
        min-height: 1.2em;
        font-size: 12.5px;
        color: var(--accent-bright);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <img src="icons/icon-48.png" alt="Orkestra" width="36" height="36" />
        <div>
          <h1>Orkestra Chrome Köprüsü</h1>
          <p class="muted">Doğrudan, sıfır sürtünmeli yerel tarayıcı bağlantısı</p>
        </div>
      </header>

      <section class="card">
        <p class="muted">
          Uzantı, yerel Orkestra masaüstü uygulamasına belirteç veya site bazlı izin gerektirmeden
          otomatik bağlanır (varsayılan bağlantı noktası 47653).
        </p>
        <div>
          <label for="port">Yerel bağlantı noktası (127.0.0.1)</label>
          <input id="port" type="number" min="1024" max="65535" />
        </div>
        <button id="save" type="button">Kaydet ve bağlan</button>
        <div id="message" role="status"></div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
