<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Orkestra Chrome Köprüsü - Ayarlar</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #1f2328; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input { font: inherit; padding: 6px; width: 100%; box-sizing: border-box; }
      button { font: inherit; padding: 6px 14px; margin-top: 10px; cursor: pointer; }
      .muted { color: #6b7280; font-size: 12px; }
      #message { margin-top: 8px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>Orkestra Chrome Köprüsü</h1>
    <p class="muted">
      Orkestra &gt; Ayarlar &gt; Chrome sayfasında köprüyü açın, eşleştirme belirtecini kopyalayıp buraya yapıştırın.
    </p>
    <label for="token">Eşleştirme belirteci</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" />
    <label for="port">Bağlantı noktası</label>
    <input id="port" type="number" min="1024" max="65535" />
    <button id="save" type="button">Kaydet ve bağlan</button>
    <div id="message" role="status"></div>

    <h2>Site izni ekle</h2>
    <p class="muted">Ajanın kullanabileceği siteyi buradan da ekleyebilirsiniz (ör. https://example.com).</p>
    <input id="site" type="url" placeholder="https://example.com" />
    <button id="allow" type="button">Siteye izin ver</button>
    <script type="module" src="options.js"></script>
  </body>
</html>
